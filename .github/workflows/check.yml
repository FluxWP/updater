name: PHP checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find lib tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Desktop source configuration regression
        run: php tests/desktop-repository.php
