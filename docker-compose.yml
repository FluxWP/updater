# Coolify / docker compose örneği. Değerleri panelin ortam değişkenlerine girin.
services:
  update:
    build: .
    restart: unless-stopped
    environment:
      FLX_UPDATE_BASE_URL: https://updater.fluxwp.com
      FLX_UPDATE_REPO: FluxWP/fluxwp
      FLX_UPDATE_GITHUB_TOKEN: ${FLX_UPDATE_GITHUB_TOKEN}
      FLX_UPDATE_WEBHOOK_SECRET: ${FLX_UPDATE_WEBHOOK_SECRET}
      FLX_UPDATE_SITES: ${FLX_UPDATE_SITES}
      FLX_UPDATE_ADMIN_USER: ${FLX_UPDATE_ADMIN_USER:-admin}
      FLX_UPDATE_ADMIN_PASSWORD: ${FLX_UPDATE_ADMIN_PASSWORD}
    volumes:
      - update-data:/var/www/html/data
    ports:
      - "8080:80"
volumes:
  update-data:
